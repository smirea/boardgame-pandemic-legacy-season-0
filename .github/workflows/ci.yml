name: CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The schema defaults that the committed readers and check scripts require. CI never runs env-manager, so no
# per-target values file exists: scripts that run from a subdirectory and xcodebuild read these instead. Nothing
# here is secret. A job that needs a credential takes it from a repository secret.
env:
  API_URL: http://127.0.0.1:14241
  API_PORT: 14241
  UI_PORT: 14240
  APP_ENV: development

defaults:
  run:
    shell: bash

jobs:
  bun:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        task: ["lint:ci", typecheck, test, build]
    env:
      CI: "true"
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
        run: bun run "$TASK"
